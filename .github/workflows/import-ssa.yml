name: Import SSA USA - validated annual batches
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type IMPORTER-SSA-2181032 to enable database writes"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ssa-full-import
  cancel-in-progress: false
jobs:
  import-ssa:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'IMPORTER-SSA-2181032'
    runs-on: ubuntu-24.04
    environment: insee-import
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python PostgreSQL driver
        run: python -m pip install 'psycopg[binary]>=3.2,<3.4'
      - name: Verify SSA ZIP (no database access)
        run: python .github/scripts/import_ssa.py --zip names.zip
      - name: Import SSA into protected tables
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: python .github/scripts/import_ssa.py --zip names.zip --import
